<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Request lifecycle diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7d8db0"/>
    </marker>
  </defs>
  <style>
    .box{fill:#121a2e;stroke-width:1.6}
    .t{font-family:'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:700;fill:#e6edf7;text-anchor:middle}
    .s{font-family:'Courier New',Consolas,monospace;font-size:11px;fill:#7d8db0;text-anchor:middle}
    .h{font-family:'Courier New',Consolas,monospace;font-size:13px;fill:#5f6f8c}
    .flow{stroke:#7d8db0;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:d 1.4s linear infinite}
    .async{stroke:#ff9f43}
    @keyframes d{to{stroke-dashoffset:-24}}
  </style>
  <rect width="1000" height="250" rx="16" fill="#0b0f1a" stroke="#1e2a44"/>

  <rect class="box" x="20"  y="40" width="160" height="56" rx="12" stroke="#4cc9f0"/>
  <text class="t" x="100" y="65">User</text><text class="s" x="100" y="83">browser / app</text>
  <rect class="box" x="200" y="40" width="160" height="56" rx="12" stroke="#4cc9f0"/>
  <text class="t" x="280" y="65">React UI</text><text class="s" x="280" y="83">Vite + Tailwind</text>
  <rect class="box" x="380" y="40" width="160" height="56" rx="12" stroke="#ffd166"/>
  <text class="t" x="460" y="65">Auth Layer</text><text class="s" x="460" y="83">JWT / OAuth 2.0</text>
  <rect class="box" x="560" y="40" width="160" height="56" rx="12" stroke="#3ddc84"/>
  <text class="t" x="640" y="65">Controller</text><text class="s" x="640" y="83">routes + validation</text>
  <rect class="box" x="740" y="40" width="160" height="56" rx="12" stroke="#8a5cff"/>
  <text class="t" x="820" y="65">Service</text><text class="s" x="820" y="83">business logic</text>

  <path class="flow" d="M180 68H198" marker-end="url(#a)"/>
  <path class="flow" d="M360 68H378" marker-end="url(#a)"/>
  <path class="flow" d="M540 68H558" marker-end="url(#a)"/>
  <path class="flow" d="M720 68H738" marker-end="url(#a)"/>

  <path class="flow" d="M790 96V128H520V158" marker-end="url(#a)"/>
  <path class="flow" d="M815 96V128H700V158" marker-end="url(#a)"/>
  <path class="flow async" d="M850 96V128H895V158" marker-end="url(#a)"/>

  <rect class="box" x="450" y="160" width="140" height="56" rx="12" stroke="#ff4d8d"/>
  <text class="t" x="520" y="185">Redis</text><text class="s" x="520" y="203">cache</text>
  <rect class="box" x="620" y="160" width="160" height="56" rx="12" stroke="#ff4d8d"/>
  <text class="t" x="700" y="185">MySQL / MongoDB</text><text class="s" x="700" y="203">database</text>
  <rect class="box" x="810" y="160" width="170" height="56" rx="12" stroke="#ff9f43"/>
  <text class="t" x="895" y="185">RabbitMQ</text><text class="s" x="895" y="203">events → email worker</text>

  <text class="h" x="30" y="150">// request lifecycle</text>
  <text class="h" x="30" y="172">grey = sync path</text>
  <text class="h" x="30" y="194" style="fill:#ff9f43">orange = async events</text>
</svg>
