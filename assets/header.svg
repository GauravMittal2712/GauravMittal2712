<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Gaurav Mittal - Full Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00e5c3"/>
      <stop offset="0.5" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#ff4d8d"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5c3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5c3" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00e5c3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#8a5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#00e5c3" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00e5c3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sym  { font-family: 'Courier New', Consolas, monospace; font-size: 26px; fill: #8a5cff; opacity: .2; animation: fl 5s ease-in-out infinite; }
    .name { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight: 800; font-size: 68px;
            fill: url(#g); fill-opacity: 0; stroke: url(#g); stroke-width: 1.6;
            stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: draw 10s ease-in-out infinite; }
    .sub  { font-family: 'Courier New', Consolas, monospace; font-size: 17px; fill: #a9b8d4; opacity: 0; animation: show 10s ease-in-out infinite; }
    .meta { font-family: 'Courier New', Consolas, monospace; font-size: 13px; fill: #5f6f8c; opacity: 0; animation: show2 10s ease-in-out infinite; }
    @keyframes fl   { 0%,100% { transform: translateY(0); opacity: .12; } 50% { transform: translateY(-16px); opacity: .5; } }
    @keyframes draw { 0% { stroke-dashoffset: 1500; fill-opacity: 0; }
                      35% { stroke-dashoffset: 0; fill-opacity: 0; }
                      50%,88% { stroke-dashoffset: 0; fill-opacity: 1; }
                      100% { stroke-dashoffset: 1500; fill-opacity: 0; } }
    @keyframes show  { 0%,38% { opacity: 0; } 52%,88% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show2 { 0%,48% { opacity: 0; } 62%,88% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <rect width="1000" height="260" rx="18" fill="#0b0f1a"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="260" rx="18" fill="url(#glowA)"/>
  <rect width="1000" height="260" rx="18" fill="url(#glowB)"/>

  <!-- drifting code symbols -->
  <text class="sym" x="70"  y="70"  style="animation-delay:0s">{ }</text>
  <text class="sym" x="190" y="215" style="animation-delay:1.2s">&lt;/&gt;</text>
  <text class="sym" x="330" y="50"  style="animation-delay:2.4s">;</text>
  <text class="sym" x="610" y="225" style="animation-delay:.6s">=&gt;</text>
  <text class="sym" x="760" y="55"  style="animation-delay:1.8s">[ ]</text>
  <text class="sym" x="880" y="200" style="animation-delay:3s">01</text>
  <text class="sym" x="905" y="95"  style="animation-delay:2s">#</text>
  <text class="sym" x="45"  y="160" style="animation-delay:3.4s">()</text>

  <!-- scanning beam -->
  <rect y="0" width="180" height="260" fill="url(#scan)">
    <animate attributeName="x" from="-200" to="1000" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <path d="M28 52V28H52M948 28H972V52M972 208V232H948M52 232H28V208" fill="none" stroke="#00e5c3" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

  <!-- name draws itself, then fills -->
  <text class="name" x="500" y="128" text-anchor="middle" textLength="780" lengthAdjust="spacingAndGlyphs">GAURAV MITTAL</text>

  <text class="sub" x="500" y="172" text-anchor="middle">FULL STACK ENGINEER  ·  SPRING BOOT × MERN  ·  UNREAL ENGINE</text>
  <text class="meta" x="500" y="204" text-anchor="middle">// B.Tech CSE (Gaming Technology) · SRM IST · CGPA 9.21</text>

  <!-- animated underline -->
  <line x1="300" y1="146" x2="700" y2="146" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>
