<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Thanks for stopping by" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1000" height="110" fill="url(#fade)"/></mask>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5c3"/><stop offset="0.5" stop-color="#8a5cff"/><stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: 'Courier New', Consolas, monospace; font-size: 15px; letter-spacing: 6px; fill: url(#t); animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>

  <g mask="url(#m)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-250 0" dur="4s" repeatCount="indefinite"/>
      <path d="M0 35 Q62.5 5 125 35 T250 35 T375 35 T500 35 T625 35 T750 35 T875 35 T1000 35 T1125 35 T1250 35 T1375 35 T1500 35 T1625 35 T1750 35 T1875 35 T2000 35" fill="none" stroke="#00e5c3" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g opacity="0.55">
      <animateTransform attributeName="transform" type="translate" from="-125 0" to="-375 0" dur="6s" repeatCount="indefinite"/>
      <path d="M0 35 Q62.5 65 125 35 T250 35 T375 35 T500 35 T625 35 T750 35 T875 35 T1000 35 T1125 35 T1250 35 T1375 35 T1500 35 T1625 35 T1750 35 T1875 35 T2000 35" fill="none" stroke="#8a5cff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <text class="t" x="500" y="92" text-anchor="middle">THANKS FOR STOPPING BY</text>
</svg>
